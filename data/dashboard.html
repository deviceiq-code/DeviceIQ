<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeviceIQ · Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-logo">IQ</div>
        <nav class="sidebar-nav">
            <a href="/dashboard.html" class="sidebar-nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="/setup.html" class="sidebar-nav-item" id="config-link">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
                <span>Setup</span>
            </a>
            <a href="/users.html" class="sidebar-nav-item" id="users-link">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Users</span>
            </a>
            <a href="/update.html" class="sidebar-nav-item" id="update-link">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span>Update</span>
            </a>
            <a href="/log.html" class="sidebar-nav-item" id="log-link">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                <span>Log</span>
            </a>
            <a href="/about.html" class="sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                <span>About</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <span class="product" id="sidebar-product"></span>
            <span class="version" id="sidebar-version"></span>
        </div>
    </aside>

    <div class="app-main">
        <header class="app-header">
            <div class="app-header-title">
                <h1>Dashboard</h1>
                <p>Live component status and controls</p>
            </div>
            <div class="app-header-actions">
                <span class="hostname-chip" id="topbar-hostname"></span>
                <span class="user-chip" id="whoami"></span>
                <button class="icon-button" id="logout-button" title="Sign out">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <main>
            <div id="components"></div>
            <button class="fab" id="add-component-button" title="Add component" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
        </main>
    </div>
</div>

<script src="/notifications.js"></script>
<script>
(function () {
    const REFRESH_INTERVAL_MS = 3000;
    let isAdmin = false;
    let refreshTimer = null;

    // Same viewBox/stroke conventions as the sidebar icons.
    const COMPONENT_ICONS = {
        Relay: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
        Button: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',
        Blinds: '<rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/>',
        Thermometer: '<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0z"/>'
    };
    const DEFAULT_ICON = '<circle cx="12" cy="12" r="9"/>';
    const GEAR_ICON = '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>';
    const TRASH_ICON = '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>';

    function svg(inner) {
        return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
    }

    function componentIcon(className) {
        const wrap = document.createElement("div");
        wrap.className = "comp-icon";
        wrap.innerHTML = svg(COMPONENT_ICONS[className] || DEFAULT_ICON);
        return wrap;
    }

    function iconButton(inner, extraClass, title, onClick) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "comp-icon-button" + (extraClass ? " " + extraClass : "");
        button.title = title;
        button.innerHTML = svg(inner);
        if (onClick) button.addEventListener("click", onClick);
        return button;
    }

    function controlButton(label, onClick) {
        const button = document.createElement("button");
        button.className = "secondary";
        button.textContent = label;
        button.addEventListener("click", onClick);
        return button;
    }

    function pill(text, kind) {
        const el = document.createElement("span");
        el.className = "pill " + kind;
        el.textContent = text;
        return el;
    }

    function bigToggle(checked, onChange) {
        const label = document.createElement("label");
        label.className = "toggle toggle-lg";
        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = checked;
        input.addEventListener("change", function () { onChange(input.checked); });
        const track = document.createElement("span");
        track.className = "track";
        label.appendChild(input);
        label.appendChild(track);
        return label;
    }

    function relayBody(item) {
        const wrap = document.createElement("div");
        wrap.className = "comp-row";
        wrap.appendChild(pill(item.state ? "On" : "Off", item.state ? "on" : "off"));

        if (isAdmin) {
            wrap.appendChild(bigToggle(!!item.state, function (checked) {
                setProperty(item.id, "state", checked ? "on" : "off");
            }));
        }
        return wrap;
    }

    function buttonBody(item) {
        const wrap = document.createElement("div");
        wrap.className = "comp-row";
        wrap.appendChild(pill(item.state ? "Pressed" : "Released", item.state ? "on" : "off"));
        return wrap;
    }

    function blindsBody(item) {
        const wrap = document.createElement("div");
        wrap.className = "comp-stack";

        const row = document.createElement("div");
        row.className = "comp-row";
        const label = item.state.charAt(0).toUpperCase() + item.state.slice(1);
        row.appendChild(pill(label + " · " + item.position + "%", item.state === "stopped" ? "off" : "warn"));
        wrap.appendChild(row);

        const bar = document.createElement("div");
        bar.className = "bar";
        const fill = document.createElement("div");
        fill.className = "bar-fill";
        fill.style.width = item.position + "%";
        bar.appendChild(fill);
        wrap.appendChild(bar);

        if (isAdmin) {
            const controls = document.createElement("div");
            controls.className = "comp-controls";
            controls.appendChild(controlButton("Open", function () { setProperty(item.id, "state", "open"); }));
            controls.appendChild(controlButton("Stop", function () { setProperty(item.id, "state", "stop"); }));
            controls.appendChild(controlButton("Close", function () { setProperty(item.id, "state", "close"); }));
            wrap.appendChild(controls);
        }
        return wrap;
    }

    function thermometerBody(item) {
        const wrap = document.createElement("div");
        wrap.className = "comp-row";

        if (!item.available) {
            wrap.appendChild(pill("Unavailable", "warn"));
        } else {
            let text = item.temperature.toFixed(1) + "°C";
            if (item.hasHumidity) text += " · " + item.humidity.toFixed(1) + "%";
            const state = document.createElement("span");
            state.className = "state";
            state.textContent = text;
            wrap.appendChild(state);
        }
        return wrap;
    }

    function removeComponent(item) {
        Notifications.confirm(
            "Remove '" + item.name + "'? This deletes it from the configuration and requires a restart to take effect.",
            { confirmLabel: "Remove" }
        ).then(function (confirmed) {
            if (!confirmed) return;

            const body = new URLSearchParams();
            body.set("id", item.id);

            fetch("/api/components/remove", { method: "POST", body: body })
                .then(function (response) { return response.json().then(function (data) { return { ok: response.ok, data: data }; }); })
                .then(function (result) {
                    if (!result.ok) {
                        Notifications.show(result.data.error || "Unable to remove the component.", { title: "Components" });
                        return;
                    }
                    refresh();
                    Notifications.confirm(
                        "Component removed from configuration. Restart now to apply?",
                        { confirmLabel: "Restart" }
                    ).then(function (confirmRestart) {
                        if (!confirmRestart) return;
                        Notifications.reboot();
                    });
                })
                .catch(function () {
                    Notifications.show("Unable to reach the device.", { title: "Components" });
                });
        });
    }

    function renderCard(item) {
        const card = document.createElement("div");
        card.className = "comp-card" + (item.enabled ? "" : " comp-disabled");

        const header = document.createElement("div");
        header.className = "comp-header";
        header.appendChild(componentIcon(item.class));

        const title = document.createElement("div");
        title.className = "comp-title";
        const name = document.createElement("div");
        name.className = "comp-name";
        name.textContent = item.name;
        const cls = document.createElement("div");
        cls.className = "comp-class";
        cls.textContent = item.class + " · #" + item.id;
        title.appendChild(name);
        title.appendChild(cls);
        header.appendChild(title);

        if (isAdmin) {
            const actions = document.createElement("div");
            actions.className = "comp-actions";
            actions.appendChild(iconButton(GEAR_ICON, "", "Configure", function () {
                window.location.href = "/component.html?id=" + item.id;
            }));
            actions.appendChild(iconButton(TRASH_ICON, "danger", "Remove", function () { removeComponent(item); }));
            header.appendChild(actions);
        }

        card.appendChild(header);

        const body = document.createElement("div");
        body.className = "comp-body";

        let content;
        if (item.class === "Relay") content = relayBody(item);
        else if (item.class === "Button") content = buttonBody(item);
        else if (item.class === "Blinds") content = blindsBody(item);
        else if (item.class === "Thermometer") content = thermometerBody(item);
        else {
            content = document.createElement("div");
            content.className = "comp-row";
            content.innerHTML = '<span class="state">No status available</span>';
        }
        body.appendChild(content);
        card.appendChild(body);

        return card;
    }

    function render(components) {
        const container = document.getElementById("components");
        container.innerHTML = "";

        if (components.length === 0) {
            container.innerHTML = '<div class="placeholder"><div class="title">No components</div><p>No components are currently running.</p></div>';
            return;
        }

        const grid = document.createElement("div");
        grid.className = "comp-grid";
        components.forEach(function (item) { grid.appendChild(renderCard(item)); });
        container.appendChild(grid);
    }

    function setProperty(id, property, value) {
        const body = new URLSearchParams();
        body.set("id", id);
        body.set("property", property);
        body.set("value", value);
        fetch("/api/components/set", { method: "POST", body: body }).finally(refresh);
    }

    function refresh() {
        fetch("/api/components").then(function (response) { return response.json(); }).then(function (data) {
            render(data.components || []);
        }).catch(function () {});
    }

    fetch("/api/session").then(function (response) { return response.json(); }).then(function (data) {
        if (!data.authenticated) {
            window.location.replace("/");
            return;
        }
        document.getElementById("topbar-hostname").textContent = data.hostname;
        document.getElementById("whoami").textContent = data.username + (data.admin ? " · admin" : "");
        document.title = "DeviceIQ [" + data.hostname + "] - Dashboard";
        document.getElementById("sidebar-product").textContent = data.productFamily + " " + data.productName;
        document.getElementById("sidebar-version").textContent = "v" + data.softwareVersion;
        if (!data.admin) {
            document.getElementById("config-link").remove();
            document.getElementById("users-link").remove();
            document.getElementById("update-link").remove();
            document.getElementById("log-link").remove();
        } else {
            if (!data.logFileEnabled) document.getElementById("log-link").remove();
            if (!data.psramAvailable) document.getElementById("update-link").remove();
        }
        isAdmin = data.admin;
        if (isAdmin) document.getElementById("add-component-button").hidden = false;

        refresh();
        refreshTimer = setInterval(refresh, REFRESH_INTERVAL_MS);
    }).catch(function () { window.location.replace("/"); });

    document.getElementById("add-component-button").addEventListener("click", function () {
        window.location.href = "/component.html";
    });

    document.getElementById("logout-button").addEventListener("click", function () {
        if (refreshTimer) clearInterval(refreshTimer);
        fetch("/api/logout", { method: "POST" }).finally(function () { window.location.replace("/"); });
    });
})();
</script>
</body>
</html>
