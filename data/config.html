<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeviceIQ · Setup</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar">
    <div class="left">
        <div class="name">DeviceIQ</div>
        <nav>
            <a href="/dashboard.html">Dashboard</a>
            <a href="/config.html" class="active">Setup</a>
        </nav>
    </div>
    <div class="right">
        <span id="whoami"></span>
        <button class="secondary" id="logout-button">Sign out</button>
    </div>
</div>

<main>
    <div class="placeholder">
        <div class="title">Device setup</div>
        <p>Network, MQTT, NTP, Telnet, and log configuration will be managed here. Coming soon.</p>
    </div>
</main>

<script>
(function () {
    fetch("/api/session").then((response) => response.json()).then((data) => {
        if (!data.authenticated) {
            window.location.replace("/");
            return;
        }
        if (!data.admin) {
            window.location.replace("/dashboard.html");
            return;
        }
        document.getElementById("whoami").textContent = data.username + " · admin";
    }).catch(() => window.location.replace("/"));

    document.getElementById("logout-button").addEventListener("click", function () {
        fetch("/api/logout", { method: "POST" }).finally(() => window.location.replace("/"));
    });
})();
</script>
</body>
</html>
