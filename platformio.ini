[env:esp32dev]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200

extra_scripts = post:scripts/pio_ota_hook.py

lib_deps =
    bblanchon/ArduinoJson
    arduino-libraries/NTPClient
    xreef/PCF8574 library@^2.4.0
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.5

build_flags =
    -D DEVICEIQ_VERSION_MAJOR=1
    -D DEVICEIQ_VERSION_MINOR=0
    -D DEVICEIQ_VERSION_REVISION=35
    -D CORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM

; Plain ESP32-WROOM-32 (classic Xtensa LX6, no PSRAM) - same firmware, no
; code changes needed. board=esp32dev's own defaults already match a
; standard WROOM-32 devkit (4MB flash, dio) so nothing needs overriding
; here the way the S3 env overrides flash_size/memory_type above.
; Select with: pio run -e esp32-wroom32 --target upload
[env:esp32-wroom32]
platform = espressif32
board = esp32dev
framework = arduino

board_build.filesystem = littlefs
; Single 3MB app slot instead of the default two ~1.25MB OTA slots - the
; default scheme left only ~100KB of headroom for the firmware to grow
; (92.4% full). Costs the dual-slot OTA rollback safety net, but nothing
; here relies on that: Web UI update is already unavailable on this board
; (no PSRAM for its upload buffer - see HandleOTAUpload), so cable
; reflashing via `pio run -e esp32-wroom32 --target upload` is already the
; only update path in practice, and that doesn't need a second slot.
board_build.partitions = huge_app.csv
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
monitor_speed = 115200

extra_scripts = post:scripts/pio_ota_hook.py

lib_deps = ${env:esp32dev.lib_deps}

build_flags =
    -D DEVICEIQ_VERSION_MAJOR=1
    -D DEVICEIQ_VERSION_MINOR=0
    -D DEVICEIQ_VERSION_REVISION=35
    -D CORE_DEBUG_LEVEL=0
